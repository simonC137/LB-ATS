name: Deploy Testing App

on:
  push:
    branches:
      - test
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      # 1️⃣ Pull code into the runner's _work directory
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Build frontend
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      - name: Build frontend
        run: |
          cd frontend
          npm run build

      # 3️⃣ Deploy frontend
      - name: Deploy frontend
        run: |
          BASE_DIR="/var/www/ATS"
          FRONTEND_DIR="$BASE_DIR/frontend"
          sudo mkdir -p "$FRONTEND_DIR"
          sudo rm -rf "$FRONTEND_DIR"/*
          sudo cp -r ./frontend/dist/* "$FRONTEND_DIR"/

      # 4️⃣ Build backend
      - name: Install backend dependencies
        run: |
          cd backend
          npm ci --omit=dev

      # 5️⃣ Deploy backend (without overwriting .env)
      - name: Deploy backend
        run: |
          BASE_DIR="/var/www/ATS"
          BACKEND_DIR="$BASE_DIR/backend"
          sudo mkdir -p "$BACKEND_DIR"
          sudo rm -rf "$BACKEND_DIR"/*
          sudo cp -r ./backend/* "$BACKEND_DIR"/
          if [ -f "$BACKEND_DIR/.env" ]; then
            echo "Preserving backend .env file."
          fi

      # 6️⃣ Ensure shared .env exists
      - name: Ensure shared .env exists
        run: |
          ENV_FILE="/var/www/ATS/.env"
          if [ ! -f "$ENV_FILE" ]; then
            echo "# Add your environment variables here" | sudo tee "$ENV_FILE"
            echo "Created placeholder .env in /var/www/ATS/"
          else
            echo "Shared .env already exists, leaving it untouched."
          fi

      # 7️⃣ Restart backend with PM2
      - name: Restart backend app with PM2
        run: |
          BACKEND_DIR="/var/www/ATS/backend"
          if pm2 list | grep -q lbats-backend; then
            echo "Restarting existing backend process..."
            pm2 restart lbats-backend
          else
            echo "Starting backend process..."
            pm2 start "$BACKEND_DIR/server.js" --name lbats-backend
